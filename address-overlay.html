<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 12px 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      display: inline-block;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
    }
    #address {
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="address">Locating...</div>

  <script>
    const RTIRL_PULL_KEY = "YOUR_PULL_KEY_HERE";
    let lastLat = null;
    let lastLon = null;

    async function reverseGeocode(lat, lon) {
      try {
        // Nominatim OpenStreetMap reverse geocoding
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`, {
          headers: { "User-Agent": "OBS-Overlay-IRL/1.0" }
        });
        const data = await res.json();

        if (data && data.address) {
          const road = data.address.road || data.address.pedestrian || "";
          const houseNumber = data.address.house_number ? `${data.address.house_number} ` : "";
          const city = data.address.city || data.address.town || data.address.village || "";
          
          // Formats as "123 Main St, City" or falls back to standard display name
          const output = road ? `${houseNumber}${road}, ${city}` : (data.display_name || "Address unavailable");
          document.getElementById("address").textContent = output;
        }
      } catch (err) {
        console.error("Geocoding failed:", err);
      }
    }

    async function fetchLocation() {
      try {
        const res = await fetch(`https://rtirl.com/api/pull?key=${RTIRL_PULL_KEY}`);
        const data = await res.json();

        if (data?.location?.latitude && data?.location?.longitude) {
          const { latitude, longitude } = data.location;

          // Only request a new address if position shifted noticeably (~15-20 meters)
          if (!lastLat || Math.hypot(latitude - lastLat, longitude - lastLon) > 0.0002) {
            lastLat = latitude;
            lastLon = longitude;
            reverseGeocode(latitude, longitude);
          }
        }
      } catch (err) {
        console.error("RTIRL fetch failed:", err);
      }
    }

    // Poll RealtimeIRL every 5 seconds
    setInterval(fetchLocation, 5000);
    fetchLocation();
  </script>
</body>
</html>
